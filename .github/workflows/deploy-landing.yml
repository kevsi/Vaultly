name: Deploy landing

on:
  push:
    branches: [main]
    paths:
      - "vaultly-landing/**"
      - ".github/workflows/deploy-landing.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    name: Cloudflare Pages
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build extension ZIP
        run: |
          python3 - <<'PY'
          import pathlib
          import zipfile

          src = pathlib.Path("extension")
          out = pathlib.Path("vaultly-landing/downloads/vaultly-extension.zip")
          out.parent.mkdir(parents=True, exist_ok=True)
          out.unlink(missing_ok=True)

          with zipfile.ZipFile(out, "w", zipfile.ZIP_DEFLATED) as archive:
              for path in sorted(src.rglob("*")):
                  if not path.is_file():
                      continue
                  if path.name == ".DS_Store":
                      continue
                  archive.write(path, path.relative_to(src))
          PY

      - name: Ensure Pages project exists
        continue-on-error: true
        run: npx --yes wrangler@4 pages project create vaultly-landing --production-branch main
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Configure idea endpoint secret
        continue-on-error: true
        run: printf '%s' "$GITHUB_ISSUE_TOKEN" | npx --yes wrangler@4 pages secret put GITHUB_ISSUE_TOKEN --project-name=vaultly-landing
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          GITHUB_ISSUE_TOKEN: ${{ secrets.GITHUB_ISSUE_TOKEN }}

      - name: Deploy to Cloudflare Pages
        run: npx --yes wrangler@4 pages deploy vaultly-landing --project-name=vaultly-landing --branch main
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
