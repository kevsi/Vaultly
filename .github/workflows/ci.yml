name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  frontend:
    name: Frontend (lint + tests + build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm audit --audit-level=high
      - run: pnpm exec biome check src extension
      - run: pnpm test
      - run: pnpm build

  backend:
    name: Backend Rust (clippy + tests)
    runs-on: windows-latest
    defaults:
      run:
        working-directory: src-tauri
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      # cache cargo : les dépendances Tauri compilent ~15 min sans
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      # scan RustSec : non-bloquant (continue-on-error) car l'écosystème Tauri
      # traîne parfois des avis « unmaintained » transitifs hors de notre
      # contrôle ; une vraie vulnérabilité reste signalée en rouge dans le job.
      - name: Installer cargo-audit
        uses: taiki-e/install-action@cargo-audit
      - name: Audit des dépendances Rust (RustSec)
        run: cargo audit
        continue-on-error: true
      # le binaire tauri-build a besoin des headers webview2 sur windows-runner :
      # fournis par le runner. La config frontend dist/ n'est pas requise
      # pour cargo test (le contexte generate_context! est compilé à partir
      # de tauri.conf.json + ../dist — on fabrique un dist minimal si absent).
      - name: Fabriquer un dist minimal (génération du contexte Tauri)
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Set-Content -Path dist/index.html -Value "<!doctype html><title>ci</title>"
      - run: cargo test --lib
      - run: cargo clippy --lib -- -D warnings

  # Le release ne se fait QUE sur Windows : ce job prouve que le code reste
  # compilable et vert hors Windows (windows-sys est bien gated, le fallback
  # DPAPI de secret.rs passe, aucune hypothèse Windows dans les 62 tests).
  cross-os:
    name: Backend Rust (${{ matrix.os }})
    strategy:
      fail-fast: false
    matrix:
      os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: src-tauri
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      # deps de compilation Tauri v2 sous Linux : webkit2gtk 4.1, épingles
      # globales (libxdo), tray (ayatana), svg des icônes (rsvg)
      - name: Dépendances système Tauri (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libxdo-dev libayatana-appindicator3-dev librsvg2-dev patchelf
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: cargo check --lib --tests
      - run: cargo test --lib
