# Release + mise à jour automatique, bi-OS (Windows / Linux).
#
# Déclenché par un tag `v*` (ex : git tag v1.2.0 && git push origin v1.2.0).
# Deux jobs SÉQUENTIELS (et non en matrice parallèle : chaque tauri-action
# relit et fusionne le latest.json de la release — en parallèle ils se
# marcheraient dessus) : Windows crée le brouillon, puis Linux ajoute ses
# artefacts + plateformes.
#
# PRÉREQUIS — clés de signature (une seule fois) :
#   1. `pnpm tauri signer generate -w ~/.tauri/vaultly.key`
#      (protège avec un mot de passe)
#   2. Colle la CLÉ PUBLIQUE affichée dans
#      src-tauri/tauri.conf.json › plugins › updater › pubkey
#   3. GitHub › Settings › Secrets and variables › Actions :
#      - TAURI_SIGNING_PRIVATE_KEY = contenu de ~/.tauri/vaultly.key
#      - TAURI_SIGNING_PRIVATE_KEY_PASSWORD = le mot de passe
#   Sans clé publique configurée, l'app détecte les versions mais refuse
#   l'installation (signature invérifiable) — jamais de crash.
#
# macOS : retiré des releases à partir de v1.2.0 (décision produit — la
# maintenance tri-OS + Gatekeeper n'est pas justifiée pour l'instant). Les
# versions 1.1.x publiées restent téléchargeables par les premiers testeurs
# mac ; leur updater ne verra simplement plus de nouvelle version macOS.
name: Release

on:
  push:
    tags: ["v*"]

jobs:
  release-windows:
    name: Build + publie (Windows)
    runs-on: windows-latest
    permissions:
      contents: write # créer la release + uploder les artefacts (GITHUB_TOKEN)
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: pnpm install --frozen-lockfile
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "Vaultly ${{ github.ref_name }}"
          releaseBody: "Vaultly pour Windows (NSIS + MSI) et Linux (deb + AppImage). L'updater intégré sert les deux plateformes via latest.json."
          releaseDraft: true
          includeUpdaterJson: true
          args: --bundles nsis,msi

  release-linux:
    name: Build + publie (Linux)
    needs: release-windows
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      # deps de compilation Tauri v2 sous Linux : webkit2gtk 4.1, épingles
      # globales (libxdo), tray (ayatana), svg des icônes (rsvg), patchelf
      # (AppImage)
      - name: Dépendances système Tauri
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libxdo-dev libayatana-appindicator3-dev librsvg2-dev patchelf
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: pnpm install --frozen-lockfile
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          # le brouillon existe déjà (job windows) : tauri-action ajoute ses
          # artefacts ET fusionne « linux-x86_64 » dans le latest.json existant
          releaseDraft: true
          includeUpdaterJson: true
          args: --bundles deb,appimage

