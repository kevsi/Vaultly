<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <style>
      /* Palette identique à l'app (src/index.css) — crème + terracotta,
         espresso en sombre. Le popup suit le thème du navigateur. */
      :root {
        color-scheme: light dark;
        --background: oklch(0.975 0.012 85);
        --foreground: oklch(0.36 0.028 60);
        --card: oklch(0.99 0.008 85);
        --primary: oklch(0.63 0.13 45);
        --primary-foreground: oklch(0.98 0.01 85);
        --muted: oklch(0.935 0.02 80);
        --muted-foreground: oklch(0.6 0.025 65);
        --border: oklch(0.89 0.022 80);
        --ring: oklch(0.72 0.1 50);
        --ok: oklch(0.6 0.08 150);
        --err: oklch(0.58 0.18 30);
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --background: oklch(0.24 0.014 60);
          --foreground: oklch(0.92 0.015 85);
          --card: oklch(0.29 0.016 60);
          --primary: oklch(0.7 0.12 45);
          --primary-foreground: oklch(0.24 0.02 60);
          --muted: oklch(0.34 0.018 60);
          --muted-foreground: oklch(0.7 0.02 75);
          --border: oklch(0.42 0.02 60);
          --ring: oklch(0.6 0.1 45);
          --ok: oklch(0.62 0.08 150);
          --err: oklch(0.65 0.17 30);
        }
      }
      * { box-sizing: border-box; }
      body {
        width: 340px;
        margin: 0;
        padding: 16px 14px 14px;
        font-family: "Segoe UI", system-ui, sans-serif;
        font-size: 13px;
        background: var(--background);
        color: var(--foreground);
      }
      .head {
        display: flex;
        align-items: center;
        gap: 10px;
        margin-bottom: 12px;
      }
      .logo {
        display: grid;
        place-items: center;
        width: 34px;
        height: 34px;
        border-radius: 10px;
        background: var(--card);
        border: 1px solid var(--border);
        box-shadow: 0 1px 2px oklch(0 0 0 / 0.06);
      }
      .logo img { width: 20px; height: 20px; }
      h1 {
        font-size: 14px;
        font-weight: 600;
        margin: 0;
        letter-spacing: 0.1px;
      }
      .domain {
        margin: 1px 0 0;
        font-size: 11px;
        color: var(--muted-foreground);
        max-width: 270px;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      label {
        display: block;
        font-size: 11px;
        font-weight: 500;
        color: var(--muted-foreground);
        margin: 10px 0 4px;
      }
      input {
        width: 100%;
        padding: 8px 10px;
        border: 1px solid var(--border);
        border-radius: 10px;
        background: var(--card);
        color: var(--foreground);
        font-size: 13px;
        transition: border-color 0.15s, box-shadow 0.15s;
      }
      input::placeholder { color: var(--muted-foreground); opacity: 0.7; }
      input:focus {
        outline: none;
        border-color: var(--ring);
        box-shadow: 0 0 0 3px color-mix(in oklch, var(--ring) 25%, transparent);
      }
      input[readonly] { color: var(--muted-foreground); background: var(--muted); }
      button {
        width: 100%;
        margin-top: 14px;
        padding: 9px;
        border: 0;
        border-radius: 12px;
        background: var(--primary);
        color: var(--primary-foreground);
        font-size: 13.5px;
        font-weight: 600;
        font-family: inherit;
        cursor: pointer;
        box-shadow: 0 1px 2px oklch(0 0 0 / 0.1);
        transition: background 0.15s, transform 0.1s;
      }
      button:hover { background: color-mix(in oklch, var(--primary) 85%, black); }
      button:active { transform: translateY(1px); box-shadow: none; }
      button:disabled { opacity: 0.55; cursor: default; transform: none; }
      #status {
        display: none;
        margin-top: 10px;
        padding: 7px 10px;
        border-radius: 10px;
        font-size: 12px;
        text-align: center;
      }
      #status.ok {
        display: block;
        background: color-mix(in oklch, var(--ok) 14%, transparent);
        color: var(--ok);
        font-weight: 600;
      }
      #status.err {
        display: block;
        background: color-mix(in oklch, var(--err) 12%, transparent);
        color: var(--err);
        font-weight: 500;
      }
      details {
        margin-top: 12px;
        border: 1px solid var(--border);
        border-radius: 10px;
        background: var(--card);
        padding: 8px 10px;
      }
      summary {
        cursor: pointer;
        font-size: 11.5px;
        font-weight: 500;
        color: var(--muted-foreground);
        user-select: none;
        display: flex;
        align-items: center;
        gap: 6px;
      }
      summary:hover { color: var(--foreground); }
      details[open] summary { margin-bottom: 8px; }
      .dot {
        width: 7px;
        height: 7px;
        border-radius: 50%;
        background: var(--border);
        flex-shrink: 0;
      }
      .dot.on { background: var(--ok); }
      details label { margin-top: 0; }
    </style>
  </head>
  <body>
    <div class="head">
      <div class="logo"><img src="icons/32.png" alt="" /></div>
      <div>
        <h1>Vaultly</h1>
        <p class="domain" id="domain"></p>
      </div>
    </div>
    <label for="url">Lien</label>
    <input id="url" readonly />
    <label for="title">Titre</label>
    <input id="title" />
    <label for="tags">Tags (séparés par des virgules)</label>
    <input id="tags" placeholder="ex : design, outil" />
    <button id="save">Ajouter à ma bibliothèque</button>
    <div id="status"></div>
    <details>
      <summary>Token de l'extension <span class="dot" id="dot"></span></summary>
      <label for="token">Colle-le depuis Réglages → Extension dans Vaultly (1re fois seulement)</label>
      <input id="token" type="password" placeholder="colle le token (sans « Bearer »)" />
    </details>
    <script src="popup.js"></script>
  </body>
</html>
