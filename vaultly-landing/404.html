<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex" />
  <title>Vaultly — page not found</title>
  <style>
    :root {
      --bg: oklch(0.975 0.012 85);
      --card: oklch(0.99 0.006 85);
      --primary: oklch(0.63 0.13 45);
      --primary-soft: oklch(0.63 0.13 45 / 0.12);
      --text: oklch(0.32 0.03 50);
      --muted: oklch(0.52 0.03 55);
      --border: oklch(0.88 0.02 80);
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
      line-height: 1.6;
      padding: 1.25rem;
    }
    main {
      max-width: 34rem;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 1.5rem;
      padding: 2rem 1.5rem;
      text-align: center;
      box-shadow: 0 1px 3px oklch(0.32 0.03 50 / 0.08);
    }
    h1 { font-size: 2rem; margin-bottom: 0.6rem; }
    p { color: var(--muted); margin-bottom: 1.25rem; }
    a { color: var(--primary); font-weight: 600; text-decoration: none; }
    a:hover { text-decoration: underline; }
    .links { display: flex; justify-content: center; gap: 0.75rem; flex-wrap: wrap; }
    .badge {
      display: inline-flex;
      margin-bottom: 1rem;
      border: 1px solid var(--border);
      border-radius: 999px;
      background: var(--primary-soft);
      color: var(--muted);
      font-size: 0.8rem;
      padding: 0.25rem 0.8rem;
    }
  </style>
</head>
<body>
  <main>
    <div class="badge">404</div>
    <h1>Page not found</h1>
    <p>This page does not exist, but Vaultly is still available in English and French.</p>
    <div class="links">
      <a href="/"><strong>English</strong></a>
      <a href="/fr/"><strong>Français</strong></a>
      <a href="https://github.com/kevsi/Vaultly/releases/latest"><strong>Download</strong></a>
    </div>
  </main>
</body>
</html>
